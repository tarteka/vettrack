services:
  angular:
    profiles:
      - dev
    hostname: ${NAME}-angular
    container_name: ${NAME}-angular
    user: "${UID}:${GID}"
    build:
      context: ./
      dockerfile: ./docker/angular/Dockerfile
    env_file:
      - .env
    volumes:
      - ./app/:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 4200:4200
    command: npx ng serve --host 0.0.0.0
    networks:
      - guno-network

  web:
    profiles:
      - pro
    hostname: ${NAME}-wen
    container_name: ${NAME}-web
    build:
      context: ./
      dockerfile: ./docker/nginx/Dockerfile
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "127.0.0.1:4200:80"
    networks:
      - guno-network
      - deploy_default

networks:
  guno-network:
    external: true
  deploy_default:
    external: true